<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 유틸리티 툴박스</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 flex h-screen overflow-hidden">

    <!-- 사이드바 메뉴 -->
    <aside class="w-64 bg-slate-900 text-white flex flex-col shadow-lg">
        <div class="p-6 text-xl font-bold border-b border-slate-800 flex items-center gap-3">
            <i class="fa-solid fa-toolbox text-blue-400"></i>
            <span>Multi-Tool</span>
        </div>
        <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
            <button onclick="switchTab('date-generator')" id="btn-date-generator" class="tab-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg text-left transition bg-blue-600 text-white font-medium">
                <i class="fa-solid fa-calendar-days w-5"></i>
                <span>날짜 생성기</span>
            </button>
            <button onclick="switchTab('text-button-gen')" id="btn-text-button-gen" class="tab-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg text-left transition text-slate-300 hover:bg-slate-800 hover:text-white">
                <i class="fa-solid fa-grip w-5"></i>
                <span>텍스트 버튼 생성</span>
            </button>
        </nav>
    </aside>

    <!-- 메인 콘텐츠 영역 -->
    <main class="flex-1 flex flex-col h-full overflow-hidden">
        <header class="h-16 bg-white border-b border-gray-200 flex items-center px-8 shadow-xs">
            <h1 id="header-title" class="text-lg font-bold text-gray-800">월간 날짜 자동 생성</h1>
        </header>

        <div class="flex-1 p-8 overflow-y-auto bg-gray-50">

            <!-- 1. 날짜 생성기 툴 -->
            <section id="date-generator" class="tool-content max-w-2xl bg-white p-6 rounded-xl shadow-xs border border-gray-200">
                <div class="flex gap-4 mb-6">
                    <div class="flex-1">
                        <label class="block text-sm font-medium text-gray-600 mb-1">년도</label>
                        <select id="select-year" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"></select>
                    </div>
                    <div class="flex-1">
                        <label class="block text-sm font-medium text-gray-600 mb-1">월</label>
                        <select id="select-month" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"></select>
                    </div>
                    <div class="flex-1">
                        <label class="block text-sm font-medium text-gray-600 mb-1">구분자</label>
                        <select id="select-separator" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                            <option value="-">- (하이픈)</option>
                            <option value="/">/ (슬래시)</option>
                            <option value=".">. (마침표)</option>
                            <option value=",">, (쉼표)</option>
                            <option value=". ">. (마침표+띄어쓰기)</option>
                        </select>
                    </div>
                </div>
                <button onclick="generateDateList()" class="w-full px-5 py-2 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 transition">날짜 리스트 생성</button>
                <div class="mt-6">
                    <label class="block text-sm font-medium text-gray-600 mb-1">결과 (시트 붙여넣기용)</label>
                    <textarea id="date-list-result" rows="10" class="w-full px-4 py-2 bg-gray-50 border border-gray-300 rounded-lg text-gray-700 font-mono text-sm" readonly></textarea>

                    <!-- 날짜 복사 완료 피드백 메시지 영역 -->
                    <div id="date-copy-status" class="text-sm font-medium text-blue-600 h-6 mt-2 transition-opacity duration-300 opacity-0"></div>

                    <button onclick="copyResult()" class="mt-1 w-full px-4 py-2 bg-slate-800 text-white text-sm rounded-lg hover:bg-slate-900 transition">결과 복사하기</button>
                </div>
            </section>

            <!-- 2. 텍스트 버튼 생성 툴 -->
            <section id="text-button-gen" class="tool-content max-w-2xl bg-white p-6 rounded-xl shadow-xs border border-gray-200 hidden">
                <textarea id="text-input-area" rows="6" placeholder="버튼으로 만들 텍스트를 줄바꿈으로 입력하세요.&#10;예:&#10;떡볶이&#10;돈가스" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 mb-4"></textarea>
                <button onclick="createButtons()" class="w-full px-5 py-2 bg-green-600 text-white font-medium rounded-lg hover:bg-green-700 transition mb-2">버튼 생성</button>

                <!-- 텍스트 버튼 복사 완료 피드백 메시지 영역 -->
                <div id="copy-status" class="text-sm font-medium text-green-600 h-6 mb-4 transition-opacity duration-300 opacity-0"></div>

                <div id="button-container" class="flex flex-wrap gap-2 pt-4 border-t border-gray-100">
                    <!-- 버튼들이 여기에 생성됩니다 -->
                </div>
            </section>

        </div>
    </main>

    <script>
        // 초기화
        window.onload = function() {
            // 날짜 생성기 초기화
            const yearSelect = document.getElementById('select-year');
            const monthSelect = document.getElementById('select-month');
            const currentYear = new Date().getFullYear();
            for (let y = 1980; y <= currentYear + 1; y++) {
                let opt = document.createElement('option');
                opt.value = y; opt.innerHTML = y + '년';
                if (y === currentYear) opt.selected = true;
                yearSelect.appendChild(opt);
            }
            for (let m = 1; m <= 12; m++) {
                let opt = document.createElement('option');
                opt.value = m; opt.innerHTML = m + '월';
                if (m === (new Date().getMonth() + 1)) opt.selected = true;
                monthSelect.appendChild(opt);
            }
        };

        // 탭 전환
        function switchTab(toolId) {
            document.querySelectorAll('.tool-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(toolId).classList.remove('hidden');
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.className = "tab-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg text-left transition text-slate-300 hover:bg-slate-800 hover:text-white";
            });
            document.getElementById('btn-' + toolId).className = "tab-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg text-left transition bg-blue-600 text-white font-medium";

            const titles = { 'date-generator': '월간 날짜 자동 생성', 'text-button-gen': '텍스트 버튼 생성' };
            document.getElementById('header-title').innerText = titles[toolId];
        }

        // [날짜 생성] 로직
        function generateDateList() {
            const year = parseInt(document.getElementById('select-year').value);
            const month = parseInt(document.getElementById('select-month').value);
            const separator = document.getElementById('select-separator').value;
            const lastDay = new Date(year, month, 0).getDate();
            let result = [];
            for (let d = 1; d <= lastDay; d++) result.push(`${year}${separator}${month}${separator}${d}`);
            document.getElementById('date-list-result').value = result.join('\n');
        }

        function copyResult() {
            const textarea = document.getElementById('date-list-result');
            const statusDiv = document.getElementById('date-copy-status');

            if(!textarea.value) {
                statusDiv.innerText = '먼저 날짜 리스트를 생성해주세요.';
                statusDiv.classList.remove('opacity-0');
                if (window.dateStatusTimer) clearTimeout(window.dateStatusTimer);
                window.dateStatusTimer = setTimeout(() => {
                    statusDiv.classList.add('opacity-0');
                }, 2000);
                return;
            }

            textarea.select();
            document.execCommand('copy');

            statusDiv.innerText = '날짜 리스트, 복사 완료!';
            statusDiv.classList.remove('opacity-0');

            if (window.dateStatusTimer) clearTimeout(window.dateStatusTimer);
            window.dateStatusTimer = setTimeout(() => {
                statusDiv.classList.add('opacity-0');
            }, 2000);
        }

        // [텍스트 버튼 생성] 로직
        function createButtons() {
            const input = document.getElementById('text-input-area').value;
            const container = document.getElementById('button-container');
            const statusDiv = document.getElementById('copy-status');
            container.innerHTML = ''; // 초기화
            statusDiv.innerText = ''; // 상태 초기화

            const lines = input.split('\n').filter(line => line.trim() !== '');
            if(lines.length === 0) {
                alert('텍스트를 한 줄 이상 입력해주세요.');
                return;
            }

            lines.forEach(text => {
                const cleanText = text.trim();
                const btn = document.createElement('button');
                btn.innerText = cleanText;
                btn.className = "px-4 py-2 bg-slate-100 border border-slate-300 rounded-lg hover:bg-blue-100 hover:border-blue-300 transition text-sm font-medium cursor-pointer";

                btn.onclick = () => {
                    navigator.clipboard.writeText(cleanText).then(() => {
                        statusDiv.innerText = `'${cleanText}', 복사 완료!`;
                        statusDiv.classList.remove('opacity-0');

                        if (window.statusTimer) clearTimeout(window.statusTimer);

                        window.statusTimer = setTimeout(() => {
                            statusDiv.classList.add('opacity-0');
                        }, 2000);
                    });
                };
                container.appendChild(btn);
            });
        }
    </script>
</body>
</html>
